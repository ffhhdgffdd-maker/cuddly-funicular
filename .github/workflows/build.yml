name: WolFox — Bluetooth V5
on:
  push:
    branches: [wolfox/bluetooth-v5]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wolfox-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-tests:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: bash run_native_tests.sh
      - run: python3 tests/test_full_bluetooth_static.py
  build:
    needs: native-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      THEOS: ${{ github.workspace }}/.theos
      WOLFOX_VERSION: '5.0.1'
      WOLFOX_EDITION: 'Full'
      WOLFOX_PROFILE: 'full-mosques'
      WOLFOX_INTERFACE_VARIANT: '5'
      WOLFOX_TARGET_BUNDLE_IDS: 'sa.gov.moia.mosques-2'
      WOLFOX_PROJECT_BUNDLE_ID: 'sa.gov.moia.mosques-2'
      WOLFOX_PANEL_BASE_URL: https://gps.p3nd.fun/api/v1
      WOLFOX_PROJECT_KEY: ${{ secrets.WOLFOX_PROJECT_KEY_MOSQUES || secrets.WOLFOX_PROJECT_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Check branch configuration
        run: python3 tools/verify_release_config.py
      - name: Build and test
        run: bash wolfox_setup_build.sh
      - name: Verify packages and matching source
        run: python3 tools/collect_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: WolFox-bluetooth-v5-5.0.1-${{ github.run_number }}-${{ github.run_attempt }}
          path: release/
          if-no-files-found: error
          retention-days: 14
