name: WolFox All Builds

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wolfox-all.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout all requested branches
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/${GITHUB_REPOSITORY}.git repo
          cd repo
          mkdir -p ../WolFox-All
          for b in WL2 WF2 WM2 WC2 WB3 WB4 WB5 WN1 WT1 WA1; do
            git fetch origin "$b"
            git archive --format=zip --output="../WolFox-All/${b}-source.zip" "origin/$b"
          done
      - name: Include latest successful design artifact note
        run: |
          cat > WolFox-All/README.txt <<'EOF'
          WolFox All source branches package.
          Includes WL2 WF2 WM2 WC2 WB3 WB4 WB5 WN1 WT1 WA1.
          Build binaries remain branch-specific and must be validated after source fixes.
          EOF
      - name: Package
        run: zip -r WolFox-All.zip WolFox-All
      - uses: actions/upload-artifact@v4
        with:
          name: WolFox-All
          path: WolFox-All.zip
          retention-days: 14
