name: WolFox Project Sources

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wolfox-all.yml'
      - 'projects/**'
      - 'tools/verify_projects.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Validate consolidated project catalog
        run: python3 tools/verify_projects.py
      - name: Package project folders and source snapshots
        run: |
          set -euo pipefail
          mkdir -p build-artifacts
          zip -qr build-artifacts/WolFox-Projects.zip projects
          (cd build-artifacts && sha256sum WolFox-Projects.zip > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: WolFox-Projects-${{ github.run_number }}
          path: build-artifacts/
          if-no-files-found: error
          retention-days: 30
