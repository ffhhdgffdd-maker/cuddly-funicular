name: Build WolFox — Independent Edition

on:
  push:
    branches: [wolfox/new-app]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wolfox-maps-${{ github.ref }}
  cancel-in-progress: true

env:
  THEOS: ${{ github.workspace }}/.theos
  WOLFOX_VERSION: 6.0.0
  WOLFOX_EDITION: Full
  WOLFOX_PROFILE: new-app
  WOLFOX_TARGET_BUNDLE_IDS: sa.gov.moia.mosques-2
  WOLFOX_PROJECT_BUNDLE_ID: sa.gov.moia.mosques-2
  WOLFOX_PANEL_BASE_URL: https://gps.p3nd.fun/api/v1
  WOLFOX_PROJECT_KEY: ${{ secrets.WOLFOX_PROJECT_KEY_MOSQUES || secrets.WOLFOX_PROJECT_KEY }}

jobs:
  branch-guard:
    name: Verify release branch
    runs-on: ubuntu-24.04
    outputs:
      build_allowed: ${{ steps.guard.outputs.build_allowed }}
    steps:
      - id: guard
        shell: bash
        run: |
          set -euo pipefail
          expected='wolfox/new-app'
          actual="${GITHUB_REF_NAME}"
          if [ "$actual" = "$expected" ]; then
            echo 'build_allowed=true' >> "$GITHUB_OUTPUT"
            echo "Building the independent WolFox edition from \`$actual\`." >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'build_allowed=false' >> "$GITHUB_OUTPUT"
            {
              echo '## Build skipped'
              echo "This workflow only packages the \`$expected\` release branch."
              echo "Selected ref: \`$actual\`. No artifact was created."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    name: WolFox · Full · arm64
    needs: branch-guard
    if: ${{ needs.branch-guard.outputs.build_allowed == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v7
      - name: Validate independent edition configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "${WOLFOX_PROJECT_KEY:-}"
          test -s WolFoxMaster.mm
          test -s WolFoxProTheme.m
          test -s build_v1_deb.sh
          grep -F '_titleLabel.text = @"WolFox";' WolFoxMaster.mm
          grep -F 'new-app' build_v1_deb.sh
      - name: Build and run Linux checks
        run: bash ./wolfox_setup_build.sh
      - name: Verify WolFox package
        shell: bash
        run: |
          set -euo pipefail
          product=WolFoxMaps
          mkdir -p release
          for mode in Rootful Rootless; do
            deb="${product}_v${WOLFOX_VERSION}_iOS15.8-27.0_${mode}.deb"
            test -s "$deb"
            test "$(dpkg-deb -f "$deb" Package)" = "com.wolfox.gpspro.maps"
            test "$(dpkg-deb -f "$deb" Version)" = "$WOLFOX_VERSION"
            dpkg-deb -c "$deb" | grep -F "${product}.plist"
            rm -rf verify
            mkdir verify
            dpkg-deb -x "$deb" verify
            plist="$(find verify -name "${product}.plist" -print -quit)"
            test -n "$plist"
            grep -F "$WOLFOX_PROJECT_BUNDLE_ID" "$plist"
            cp "$deb" release/
          done
          test -s "${product}.dylib"
          file "${product}.dylib" | grep -F 'Mach-O 64-bit'
          cp "${product}.dylib" release/
          cat > release/BUILD_INFO.txt <<EOF
          PRODUCT=WolFox
          VERSION=${WOLFOX_VERSION}
          PROFILE=${WOLFOX_PROFILE}
          ARCHITECTURE=arm64
          IOS_RANGE=15.8-27.0
          TARGET=${WOLFOX_PROJECT_BUNDLE_ID}
          COMMIT=${GITHUB_SHA}
          EOF
          (cd release && sha256sum * > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v7
        with:
          name: WolFox-Maps-${{ github.run_number }}-arm64
          if-no-files-found: error
          retention-days: 14
          path: release/
