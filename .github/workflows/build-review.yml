name: WolFox runtime review
on:
  push:
    branches: [codex/wolfox-runtime-review]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wolfox-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-tests:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: bash run_native_tests.sh
      - run: python3 tests/test_full_bluetooth_static.py
  build:
    needs: native-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        edition: [Full, Lite]
    env:
      THEOS: ${{ github.workspace }}/.theos
      WOLFOX_VERSION: 2.0.1
      WOLFOX_EDITION: ${{ matrix.edition }}
      WOLFOX_TARGET_BUNDLE_IDS: sa.gov.moia.mosques-2
      WOLFOX_PROJECT_BUNDLE_ID: sa.gov.moia.mosques-2
      WOLFOX_PANEL_BASE_URL: https://gps.p3nd.fun/api/v1
      WOLFOX_PROJECT_KEY: ${{ secrets.WOLFOX_PROJECT_KEY_MOSQUES || secrets.WOLFOX_PROJECT_KEY }}
    steps:
      - uses: actions/checkout@v4
      - run: bash wolfox_setup_build.sh
      - name: Package exact source and binaries
        run: |
          mkdir -p release
          cp WolFox*.deb WolFox*.dylib release/
          printf 'COMMIT=%s\nEDITION=%s\nVERSION=%s\nRUN=%s\n' "$GITHUB_SHA" "$WOLFOX_EDITION" "$WOLFOX_VERSION" "$GITHUB_RUN_ID" > release/BUILD_INFO.txt
          git archive --format=zip --output=release/WolFox-Source.zip HEAD
          (cd release && sha256sum * > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: WolFox-review-${{ matrix.edition }}-${{ github.run_number }}
          path: release/
          if-no-files-found: error
          retention-days: 14
