name: Build WolFox Lite 2.0.0

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      bundle_ids:
        description: "Bundle IDs مفصولة بفاصلة"
        required: false
        default: "sa.gov.moia.mosques-2"

permissions:
  contents: read

concurrency:
  group: wolfox-lite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build-lite:
    name: Lite Linux tests and iOS arm64 packages
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      THEOS: ${{ github.workspace }}/.theos
      WOLFOX_TARGET_BUNDLE_IDS: ${{ inputs.bundle_ids || 'sa.gov.moia.mosques-2' }}
      WOLFOX_PROJECT_KEY: ${{ secrets.WOLFOX_PROJECT_KEY }}
      WOLFOX_PANEL_BASE_URL: https://gps.p3nd.fun/api/v1
      WOLFOX_EDITION: Lite
      WOLFOX_VERSION: 2.0.0-Lite

    steps:
      - uses: actions/checkout@v4

      - name: Install compatibility-check dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep

      - name: Run Full and Lite safety checks
        run: |
          chmod +x ./*.sh tools/*.sh
          ./run_all_linux_tests.sh

      - name: Build Lite DEB packages
        run: ./wolfox_setup_build.sh

      - name: Normalize Lite output names
        run: |
          test -s WolFoxLite.dylib
          test -s WolFoxLite_v2.0.0-Lite_iOS15.8-26.5_Rootful.deb
          test -s WolFoxLite_v2.0.0-Lite_iOS15.8-26.5_Rootless.deb
          mv WolFoxLite.dylib WolFoxGPSLite.dylib
          mv WolFoxLite_v2.0.0-Lite_iOS15.8-26.5_Rootful.deb WolFoxGPS-Lite-v2.0.0-iOS15.8-26.5-Rootful.deb
          mv WolFoxLite_v2.0.0-Lite_iOS15.8-26.5_Rootless.deb WolFoxGPS-Lite-v2.0.0-iOS15.8-26.5-Rootless.deb

      - name: Verify Lite outputs
        run: |
          test -s WolFoxGPSLite.dylib
          test -s WolFoxGPS-Lite-v2.0.0-iOS15.8-26.5-Rootful.deb
          test -s WolFoxGPS-Lite-v2.0.0-iOS15.8-26.5-Rootless.deb
          file WolFoxGPSLite.dylib
          dpkg-deb --info WolFoxGPS-Lite-v2.0.0-iOS15.8-26.5-Rootful.deb
          dpkg-deb --info WolFoxGPS-Lite-v2.0.0-iOS15.8-26.5-Rootless.deb
          sha256sum \
            WolFoxGPSLite.dylib \
            WolFoxGPS-Lite-v2.0.0-iOS15.8-26.5-Rootful.deb \
            WolFoxGPS-Lite-v2.0.0-iOS15.8-26.5-Rootless.deb > SHA256SUMS.txt
          cp SHA256SUMS.txt SHA256SUMS-Lite.txt
          cat SHA256SUMS.txt

      - name: Create reproducible Lite release bundle
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_DIR="WolFox-Lite-2.0.0"
          mkdir -p "$RELEASE_DIR/bin" "$RELEASE_DIR/source"
          cp WolFoxGPSLite.dylib "$RELEASE_DIR/bin/"
          cp WolFoxGPS-Lite-v2.0.0-iOS15.8-26.5-Rootful.deb "$RELEASE_DIR/bin/"
          cp WolFoxGPS-Lite-v2.0.0-iOS15.8-26.5-Rootless.deb "$RELEASE_DIR/bin/"
          cp SHA256SUMS.txt "$RELEASE_DIR/"
          cat > "$RELEASE_DIR/BUILD_INFO.txt" <<EOF
          PRODUCT=WolFox Lite
          VERSION=2.0.0
          EDITION=Lite
          ARCHITECTURE=arm64
          IOS_RANGE=15.8-26.5
          COMMIT=${GITHUB_SHA}
          RUN_ID=${GITHUB_RUN_ID}
          RUN_NUMBER=${GITHUB_RUN_NUMBER}
          API_BASE_URL=https://gps.p3nd.fun/api/v1
          PROJECT_KEY_SOURCE=GitHub Actions secret WOLFOX_PROJECT_KEY
          EOF
          git archive --format=tar.gz --prefix=WolFox-Lite-2.0.0-source/ \
            --output "$RELEASE_DIR/source/WolFox-Lite-2.0.0-source-${GITHUB_SHA::12}.tar.gz" "$GITHUB_SHA"
          (cd "$RELEASE_DIR" && sha256sum BUILD_INFO.txt source/*.tar.gz bin/* > RELEASE_SHA256SUMS.txt)
          zip -q -r WolFox-Lite-2.0.0-Deploy.zip "$RELEASE_DIR"
          test -s WolFox-Lite-2.0.0-Deploy.zip
          test -s "$RELEASE_DIR/BUILD_INFO.txt"
          test -s "$RELEASE_DIR/source/WolFox-Lite-2.0.0-source-${GITHUB_SHA::12}.tar.gz"

      - name: Upload Lite packages
        uses: actions/upload-artifact@v4
        with:
          name: WolFox-GPS-Lite-2.0.0-iOS15.8-26.5-arm64-${{ github.run_number }}
          path: |
            WolFoxGPSLite.dylib
            WolFoxGPS-Lite-v2.0.0-iOS15.8-26.5-Rootful.deb
            WolFoxGPS-Lite-v2.0.0-iOS15.8-26.5-Rootless.deb
            WolFox-Lite-2.0.0-Deploy.zip
            WolFox-Lite-2.0.0/BUILD_INFO.txt
            WolFox-Lite-2.0.0/RELEASE_SHA256SUMS.txt
            WolFox-Lite-2.0.0/source/*.tar.gz
            SHA256SUMS.txt
            SHA256SUMS-Lite.txt
          if-no-files-found: error
          retention-days: 14
